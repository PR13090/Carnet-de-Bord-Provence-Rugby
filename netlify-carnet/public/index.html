<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Provence Rugby — Carnet de bord</title>
  <link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet PR">
<meta name="theme-color" content="#0A0A0A">
<link rel="preload" href="/fonts/glacial-indifference-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Charte Provence Rugby, identique à la plateforme stats joueurs : fond noir, panneaux anthracite,
   blanc, gris, rouge club en accent, jaune en repère. Titres en Glacial Indifference capitales,
   texte en Helvetica Neue, coins carrés. */
  @font-face{ font-family:"Glacial Indifference"; font-weight:400; font-display:swap; src:url(/fonts/glacial-indifference-400.woff2) format("woff2"); }
  @font-face{ font-family:"Glacial Indifference"; font-weight:700; font-display:swap; src:url(/fonts/glacial-indifference-700.woff2) format("woff2"); }
  :root{
    color-scheme:dark;
    --bg:#000000;
    --surface:#1E1E1E;
    --raise:#26282C;
    --ink:#FFFFFF;
    --muted:#9C9C9C;
    --line:#33373D;
    --accent:#C20029;
    --accent-soft:rgba(194,0,41,.16);
    --ochre:#F1D436;
    --display:"Glacial Indifference","Century Gothic","Avenir Next","Helvetica Neue",Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{ background:var(--bg); }
  .app{
    font-family:var(--body);
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 18px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header .logo{ width:34px; height:auto; color:var(--ink); flex-shrink:0; }
  .club-name{
    font-family:var(--display);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:transparent;
    border:none;
    border-radius:0;
    color:var(--ink);
    padding:2px 0;
    width:100%;
    border-bottom:1px solid transparent;
  }
  .club-name:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .club-sub{ font-family:var(--display); font-size:11px; color:var(--muted); letter-spacing:0.14em; text-transform:uppercase; margin-top:2px; }

  main{
    flex:1;
    overflow-y:auto;
    padding:22px 16px 100px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .section-head{ margin-bottom:16px; }
  .eyebrow{ font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
  h1{ font-family:var(--display); font-weight:700; font-size:28px; line-height:1; margin:0; letter-spacing:0.02em; text-transform:uppercase; color:var(--ink); }
  .divider{ display:flex; align-items:center; gap:8px; margin:14px 0 20px; }
  .divider .line{ flex:1; height:1px; background:var(--line); }
  .divider .mark{ width:24px; height:3px; background:var(--accent); flex-shrink:0; }

  h2.sub{ font-family:var(--display); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink); margin:26px 0 12px; }
  h2.sub:first-of-type{ margin-top:0; }

  .card{
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:0;
    padding:16px;
    margin-bottom:14px;
  }
  .card-label{ font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .card textarea{
    width:100%;
    min-height:120px;
    border:none;
    background:transparent;
    resize:vertical;
    font-family:var(--body);
    font-size:16px;
    line-height:1.6;
    color:var(--ink);
    padding:0;
  }
  .card textarea::placeholder{ color:var(--muted); }
  .card textarea:focus{ outline:none; }
  .save-hint{ font-family:var(--display); font-size:11px; letter-spacing:0.1em; color:var(--ochre); opacity:0; transition:opacity .3s; }
  .save-hint.show{ opacity:1; }

  .image-drop{
    display:block;
    border:1px dashed var(--line);
    border-radius:0;
    padding:22px 16px;
    text-align:center;
    cursor:pointer;
    background:var(--surface);
  }
  .image-drop input{ display:none; }
  .image-drop .lbl{ font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink); }
  .image-drop .hint{ font-size:12px; color:var(--muted); margin-top:4px; }
  .image-preview{ position:relative; border:1px solid var(--line); overflow:hidden; margin-bottom:14px; }
  .image-preview img{ width:100%; display:block; }
  .image-preview .remove-img{
    position:absolute; top:10px; right:10px;
    background:rgba(0,0,0,0.75);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:0;
    padding:8px 12px;
    font-family:var(--display);
    font-weight:700;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .img-status{ font-size:12px; color:var(--muted); margin:6px 0 14px; }

  .photo-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-bottom:14px;
  }
  .photo-thumb{ position:relative; border:1px solid var(--line); overflow:hidden; }
  .photo-thumb img{ width:100%; display:block; }
  .photo-del{
    position:absolute; top:6px; right:6px;
    width:28px; height:28px;
    background:rgba(0,0,0,0.75);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:0;
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }

  .add-form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:0;
    padding:14px;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
  .field input, .field select{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:0;
    padding:11px 12px;
    font-family:var(--body);
    font-size:16px;
    color:var(--ink);
    width:100%;
  }
  .field input::placeholder{ color:var(--muted); }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .btn-add{
    font-family:var(--display);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    background:var(--accent);
    color:#fff;
    border:1px solid var(--accent);
    border-radius:0;
    padding:12px 16px;
    cursor:pointer;
    width:100%;
  }
  .btn-add:active{ background:#9E0021; }

  .item-list{ display:flex; flex-direction:column; gap:12px; }
  .item-card{
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:0;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-title{ font-weight:700; font-size:15px; margin:0; }
  .item-meta{ font-size:12px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }
  .tag{
    font-family:var(--display);
    font-weight:700;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:3px 8px;
    border:1px solid var(--line);
    flex-shrink:0;
    color:var(--muted);
  }
  .del-btn{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; line-height:1; padding:2px 6px; flex-shrink:0; }
  .del-btn:active{ color:var(--accent); }
  .item-embed{ overflow:hidden; background:#000; aspect-ratio:16/9; }
  .item-embed iframe{ width:100%; height:100%; border:none; display:block; }
  .yt-thumb{ position:relative; display:block; }
  .yt-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .play-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,0.92);
    display:flex; align-items:center; justify-content:center;
  }
  .item-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--display);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border-bottom:2px solid var(--accent);
    padding-bottom:2px;
    width:fit-content;
  }
  .empty{ font-size:13px; color:var(--muted); padding:10px 0 20px; }
  h2.sub.add-title{ margin-top:26px; }

  img[data-zoom]{ cursor:zoom-in; }
  .lightbox{
    position:fixed; inset:0; z-index:100;
    display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.96);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .lightbox-close{
    position:absolute; top:calc(12px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right));
    width:40px; height:40px; border-radius:0;
    background:rgba(255,255,255,0.12); color:var(--ink);
    border:1px solid var(--line); font-size:24px; line-height:1; cursor:pointer;
  }

  nav.tabbar{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:rgba(0,0,0,0.94);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:0 4px calc(8px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:transparent;
    border:none;
    border-top:3px solid transparent;
    color:var(--muted);
    padding:8px 2px 6px;
    cursor:pointer;
    font-family:var(--display);
    font-weight:700;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.15;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn .ic{ stroke:var(--muted); }
  .nav-btn.active{ color:var(--ink); border-top-color:var(--accent); }
  .nav-btn.active .ic{ stroke:var(--ink); }
</style>
</head>

  </header>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="" />
  <button class="lightbox-close" aria-label="Fermer">&times;</button>
</div>

<script>
const STORAGE_KEY = 'rugby-carnet:data';
const IMAGE_KEY = 'rugby-carnet:gameplan-image';
const ADV_IMAGES_KEY = 'rugby-carnet:adversaire-images';

const TABS = [
  {id:'gamePlan', label:'Game Plan', icon:'board'},
  {id:'lancements', label:'Lancements', icon:'arrow'},
  {id:'videoSemaine', label:'Vidéo semaine', icon:'play'},
  {id:'presentationAdversaire', label:'Adversaire', icon:'eye'}
];

const ICONS = {
  board: '<rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke-width="1.6"/><path d="M7 9h10M7 13h10M7 17h6" stroke-width="1.6" stroke-linecap="round"/>',
  arrow: '<path d="M4 12h13M12 6l7 6-7 6" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  play: '<circle cx="12" cy="12" r="9" fill="none" stroke-width="1.6"/><path d="M10 8.5l6 3.5-6 3.5z" stroke-width="1.2" stroke-linejoin="round"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" fill="none" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke-width="1.6"/>'
};

let data = {
  clubName:'Provence Rugby',
  gamePlan:{ notes:'' },
  lancements:{ videos:[] },
  videoSemaine:{ videos:[] },
  presentationAdversaire:{ notes:'' }
};
let gamePlanImage = null; // {dataUrl, name}
let adversaireImages = []; // [{id, dataUrl, name}]
let activeTab = 'gamePlan';

function youtubeId(url){
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  return yt ? yt[1] : null;
}

function embedUrl(url){
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(vimeo) return 'https://player.vimeo.com/video/'+vimeo[1];
  return null;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function storageGet(key){
  try{
    const res = await fetch('/.netlify/functions/storage?key=' + encodeURIComponent(key));
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.error('Erreur de lecture', e); return null; }
}

async function storageSet(key, value){
  try{
    await fetch('/.netlify/functions/storage', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ key, value })
    });
  }catch(e){ console.error('Erreur de sauvegarde', e); }
}

async function storageDelete(key){
  try{
    await fetch('/.netlify/functions/storage?key=' + encodeURIComponent(key), { method: 'DELETE' });
  }catch(e){ console.error('Erreur de suppression', e); }
}

async function loadAll(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      data = Object.assign(data, JSON.parse(res.value));
    }
  }catch(e){ /* pas de donnée existante */ }
  try{
    const res = await storageGet(IMAGE_KEY);
    if(res && res.value){
      gamePlanImage = JSON.parse(res.value);
    }
  }catch(e){ /* pas d'image existante */ }
  try{
    const res = await storageGet(ADV_IMAGES_KEY);
    if(res && res.value){
      adversaireImages = JSON.parse(res.value);
    }
  }catch(e){ /* pas de photos existantes */ }
  render();
}

async function saveData(){
  await storageSet(STORAGE_KEY, JSON.stringify(data));
}

async function saveImage(){
  if(gamePlanImage){
    await storageSet(IMAGE_KEY, JSON.stringify(gamePlanImage));
  }else{
    await storageDelete(IMAGE_KEY);
  }
}

async function saveAdvImages(){
  await storageSet(ADV_IMAGES_KEY, JSON.stringify(adversaireImages));
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1400;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  TABS.forEach(tab=>{
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (tab.id === activeTab ? ' active' : '');
    btn.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor">${ICONS[tab.icon]}</svg><span>${tab.label}</span>`;
    btn.addEventListener('click', ()=>{ activeTab = tab.id; render(); });
    bar.appendChild(btn);
  });
}

function videoAddForm(prefix){
  return `
    <div class="add-form">
      <div class="field"><label>Titre</label><input id="${prefix}Title" placeholder="Titre de la vidéo"/></div>
      <div class="field"><label>Lien (YouTube, Vimeo, Drive)</label><input id="${prefix}Url" placeholder="https://..."/></div>
      <button class="btn-add" data-add="${prefix}">Ajouter la vidéo</button>
    </div>
  `;
}

function fichierAddForm(prefix){
  return `
    <div class="add-form">
      <div class="field"><label>Titre</label><input id="${prefix}Title" placeholder="Nom du document"/></div>
      <div class="field"><label>Lien (Drive, Dropbox...)</label><input id="${prefix}Url" placeholder="https://..."/></div>
      <button class="btn-add" data-add="${prefix}">Ajouter le fichier</button>
    </div>
  `;
}

function videoListHtml(videos, kind){
  if(!videos.length) return '<p class="empty">Aucune vidéo pour le moment.</p>';
  return '<div class="item-list">' + videos.slice().reverse().map(v=>{
    const ytId = youtubeId(v.url);
    const vimeoEmbed = !ytId ? embedUrl(v.url) : null;
    let media = '';
    if(ytId){
      media = `<div class="item-embed"><iframe src="https://www.youtube.com/embed/${ytId}" title="${escapeHtml(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
    } else if(vimeoEmbed){
      media = `<div class="item-embed"><iframe src="${vimeoEmbed}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    } else {
      media = `<a class="item-link" href="${v.url}" target="_blank" rel="noopener">Ouvrir la vidéo →</a>`;
    }
    return `
      <div class="item-card">
        <div class="item-top">
          <div><p class="item-title">${escapeHtml(v.title)}</p><p class="item-meta">${v.date}</p></div>
          <button class="del-btn" data-del="${kind}" data-id="${v.id}">&times;</button>
        </div>
        ${media}
      </div>
    `;
  }).join('') + '</div>';
}

function fichierListHtml(fichiers, kind){
  if(!fichiers.length) return '<p class="empty">Aucun fichier pour le moment.</p>';
  return '<div class="item-list">' + fichiers.slice().reverse().map(f=>`
    <div class="item-card">
      <div class="item-top">
        <div><p class="item-title">${escapeHtml(f.title)}</p><p class="item-meta">${f.date}</p></div>
        <button class="del-btn" data-del="${kind}" data-id="${f.id}">&times;</button>
      </div>
      <a class="item-link" href="${f.url}" target="_blank" rel="noopener">Ouvrir le fichier →</a>
    </div>
  `).join('') + '</div>';
}

function renderMain(){
  const main = document.getElementById('mainArea');
  let html = '';

  if(activeTab === 'gamePlan'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Game Plan</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      <div class="card">
        <p class="card-label"><span>Notes</span><span class="save-hint" id="hint-notes">enregistré</span></p>
        <textarea id="gamePlanNotes" placeholder="Principes, consignes, structure du plan de jeu...">${escapeHtml(data.gamePlan.notes || '')}</textarea>
      </div>
      <h2 class="sub">Photo du plan de jeu</h2>
      ${gamePlanImage ? `
        <div class="image-preview">
          <img src="${gamePlanImage.dataUrl}" alt="Game plan" data-zoom />
          <button class="remove-img" id="removeImg">Supprimer</button>
        </div>
        <label class="image-drop" style="display:block; margin-top:10px;">
          <input type="file" id="gamePlanImageInput" accept="image/*" />
          <div class="lbl">Remplacer la photo</div>
        </label>
      ` : `
        <label class="image-drop">
          <input type="file" id="gamePlanImageInput" accept="image/*" />
          <div class="lbl">+ Ajouter une photo</div>
          <div class="hint">Prendre une photo ou choisir depuis la pellicule</div>
        </label>
      `}
    `;
  }

  if(activeTab === 'lancements'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Lancements</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      ${videoListHtml(data.lancements.videos, 'lancements')}
      <h2 class="sub add-title">Ajouter une vidéo</h2>
      ${videoAddForm('lanc')}
    `;
  }

  if(activeTab === 'videoSemaine'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Vidéo de la semaine</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      ${videoListHtml(data.videoSemaine.videos, 'videoSemaine')}
      <h2 class="sub add-title">Ajouter une vidéo</h2>
      ${videoAddForm('vsem')}
    `;
  }

  if(activeTab === 'presentationAdversaire'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Présentation de l'adversaire</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      <div class="card">
        <p class="card-label"><span>Notes</span><span class="save-hint" id="hint-adv-notes">enregistré</span></p>
        <textarea id="advNotes" placeholder="Points clés, forces/faiblesses, joueurs à surveiller...">${escapeHtml(data.presentationAdversaire.notes || '')}</textarea>
      </div>
      <h2 class="sub">Photos</h2>
      ${adversaireImages.length ? `
        <div class="photo-grid">
          ${adversaireImages.map(img => `
            <div class="photo-thumb">
              <img src="${img.dataUrl}" alt="" data-zoom />
              <button class="photo-del" data-adv-del="${img.id}">&times;</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <label class="image-drop">
        <input type="file" id="advImageInput" accept="image/*" multiple />
        <div class="lbl">+ Ajouter une photo</div>
        <div class="hint">Plusieurs photos possibles</div>
      </label>
    `;
  }

  main.innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  const notesArea = document.getElementById('gamePlanNotes');
  if(notesArea){
    notesArea.addEventListener('blur', ()=>{
      data.gamePlan.notes = notesArea.value;
      saveData();
      const hint = document.getElementById('hint-notes');
      if(hint){ hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'), 1400); }
    });
  }

  const imgInput = document.getElementById('gamePlanImageInput');
  if(imgInput){
    imgInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImage(file);
        gamePlanImage = { dataUrl, name: file.name };
        await saveImage();
        render();
      }catch(err){
        alert("Impossible de charger l'image, réessayez avec une autre photo.");
      }
    });
  }

  const removeImg = document.getElementById('removeImg');
  if(removeImg){
    removeImg.addEventListener('click', async ()=>{
      gamePlanImage = null;
      await saveImage();
      render();
    });
  }

  const advNotes = document.getElementById('advNotes');
  if(advNotes){
    advNotes.addEventListener('blur', ()=>{
      data.presentationAdversaire.notes = advNotes.value;
      saveData();
      const hint = document.getElementById('hint-adv-notes');
      if(hint){ hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'), 1400); }
    });
  }

  const advImageInput = document.getElementById('advImageInput');
  if(advImageInput){
    advImageInput.addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      try{
        for(const file of files){
          const dataUrl = await compressImage(file);
          adversaireImages.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), dataUrl, name:file.name});
        }
        await saveAdvImages();
        render();
      }catch(err){
        alert("Impossible de charger une des photos, réessayez.");
      }
    });
  }

  document.querySelectorAll('[data-zoom]').forEach(img=>{
    img.addEventListener('click', ()=>openLightbox(img.src));
  });

  document.querySelectorAll('[data-adv-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      adversaireImages = adversaireImages.filter(img=>img.id !== btn.dataset.advDel);
      await saveAdvImages();
      render();
    });
  });

  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const prefix = btn.dataset.add;
      const titleEl = document.getElementById(prefix+'Title');
      const urlEl = document.getElementById(prefix+'Url');
      const title = titleEl.value.trim();
      const url = urlEl.value.trim();
      if(!title || !url) return;
      const entry = {id:Date.now().toString(36), title, url, date:new Date().toLocaleDateString('fr-FR')};
      if(prefix === 'lanc') data.lancements.videos.push(entry);
      if(prefix === 'vsem') data.videoSemaine.videos.push(entry);
      titleEl.value = ''; urlEl.value = '';
      saveData();
      render();
    });
  });

  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = btn.dataset.del;
      const id = btn.dataset.id;
      if(kind === 'lancements') data.lancements.videos = data.lancements.videos.filter(v=>v.id!==id);
      if(kind === 'videoSemaine') data.videoSemaine.videos = data.videoSemaine.videos.filter(v=>v.id!==id);
      saveData();
      render();
    });
  });
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

// Un tap n'importe où (photo, fond ou croix) referme le plein écran
document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeLightbox(); });

function render(){
  document.getElementById('clubName').value = data.clubName || 'Provence Rugby';
  renderTabbar();
  renderMain();
}

document.getElementById('clubName').addEventListener('blur', e=>{
  data.clubName = e.target.value;
  saveData();
});

loadAll();
</script>
</body>
</html>
