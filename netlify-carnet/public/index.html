<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Provence Rugby — Carnet de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0A0A0A;
    --pitch:#141414;
    --pitch-light:#1F1F1F;
    --chalk:#F3F0E8;
    --chalk-dim:#E5E0D2;
    --ink:#211E16;
    --ink-soft:#5A5646;
    --amber:#B08A3C;
    --amber-dark:#6E5522;
    --steel:#8478A8;
    --steel-dark:#3B3457;
    --sage:#7C8F5E;
    --sage-dark:#3D4A2A;
    --line:rgba(243,240,232,0.14);
    --danger:#B24C3C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{ background:var(--pitch-dark); }
  .app{
    font-family:'Inter',sans-serif;
    color:var(--chalk);
    background:
      repeating-linear-gradient(90deg, rgba(243,240,232,0.02) 0px, rgba(243,240,232,0.02) 1px, transparent 1px, transparent 64px),
      linear-gradient(160deg, var(--pitch-dark), var(--pitch) 55%, var(--pitch-light));
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 18px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header svg{ flex-shrink:0; }
  .club-name{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    background:transparent;
    border:none;
    color:var(--chalk);
    padding:2px 0;
    width:100%;
    border-bottom:1px solid transparent;
  }
  .club-name:focus{ outline:none; border-bottom:1px solid var(--amber); }
  .club-sub{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--sage); letter-spacing:0.05em; margin-top:2px;}

  main{
    flex:1;
    overflow-y:auto;
    padding:20px 18px 100px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .section-head{ margin-bottom:16px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--amber); margin:0 0 4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:0.01em; color:var(--chalk); }
  .divider{ display:flex; align-items:center; gap:8px; margin:14px 0 20px; }
  .divider .line{ flex:1; height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); }
  .divider .mark{ width:9px; height:9px; border:1px solid var(--line); border-radius:50%; flex-shrink:0; }

  h2.sub{ font-family:'Oswald',sans-serif; font-weight:500; font-size:15px; text-transform:uppercase; letter-spacing:0.02em; color:var(--chalk-dim); margin:26px 0 12px; }
  h2.sub:first-of-type{ margin-top:0; }

  .card{
    background:var(--chalk);
    color:var(--ink);
    border-radius:12px;
    padding:16px 16px;
    margin-bottom:14px;
  }
  .card-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .card textarea{
    width:100%;
    min-height:120px;
    border:none;
    background:transparent;
    resize:vertical;
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.6;
    color:var(--ink);
    padding:0;
  }
  .card textarea:focus{ outline:none; }
  .save-hint{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--sage-dark); opacity:0; transition:opacity .3s; }
  .save-hint.show{ opacity:1; }

  .image-drop{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:22px 16px;
    text-align:center;
    cursor:pointer;
    background:rgba(243,240,232,0.03);
  }
  .image-drop input{ display:none; }
  .image-drop .lbl{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.03em; text-transform:uppercase; color:var(--amber); }
  .image-drop .hint{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--sage); margin-top:4px; }
  .image-preview{ position:relative; border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .image-preview img{ width:100%; display:block; }
  .image-preview .remove-img{
    position:absolute; top:10px; right:10px;
    background:rgba(10,10,10,0.7);
    color:var(--chalk);
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    cursor:pointer;
  }
  .img-status{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--sage); margin:6px 0 14px; }

  .photo-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
.photo-thumb{ position:relative; border-radius:10px; overflow:hidden; }
.photo-thumb img{ width:100%; display:block; }
  .photo-del{
    position:absolute; top:6px; right:6px;
    width:26px; height:26px;
    background:rgba(10,10,10,0.7);
    color:var(--chalk);
    border:none;
    border-radius:50%;
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }

  .add-form{
    background:rgba(243,240,232,0.05);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--sage); }
  .field input, .field select{
    background:var(--chalk);
    border:none;
    border-radius:8px;
    padding:11px 12px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
    width:100%;
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .btn-add{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    background:var(--amber);
    color:#2A1E0A;
    border:none;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
    width:100%;
  }
  .btn-add:active{ background:#c49a4c; }

  .item-list{ display:flex; flex-direction:column; gap:12px; }
  .item-card{
    background:var(--chalk);
    color:var(--ink);
    border-radius:12px;
    padding:14px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-title{ font-weight:500; font-size:14.5px; margin:0; }
  .item-meta{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    flex-shrink:0;
    background:#E6E2EF;
    color:var(--steel-dark);
  }
  .del-btn{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:20px; line-height:1; padding:2px 6px; flex-shrink:0; }
  .del-btn:active{ color:var(--danger); }
  .item-embed{ border-radius:8px; overflow:hidden; background:#000; aspect-ratio:16/9; }
  .item-embed iframe{ width:100%; height:100%; border:none; display:block; }
  .yt-thumb{ position:relative; display:block; }
  .yt-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .play-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%;
    background:rgba(243,240,232,0.92);
    display:flex; align-items:center; justify-content:center;
  }
  .item-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--steel-dark);
    text-decoration:none;
    width:fit-content;
  }
  .empty{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--sage); padding:10px 0 20px; }

  nav.tabbar{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:rgba(10,10,10,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    padding:6px 2px;
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:0.01em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.15;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn .ic{ stroke:var(--chalk-dim); }
  .nav-btn.active{ color:var(--amber); }
  .nav-btn.active .ic{ stroke:var(--amber); }
</style>
</head>

function embedUrl(url){
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(vimeo) return 'https://player.vimeo.com/video/'+vimeo[1];
  return null;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function storageGet(key){
  try{
    const res = await fetch('/.netlify/functions/storage?key=' + encodeURIComponent(key));
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.error('Erreur de lecture', e); return null; }
}

async function storageSet(key, value){
  try{
    await fetch('/.netlify/functions/storage', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ key, value })
    });
  }catch(e){ console.error('Erreur de sauvegarde', e); }
}

async function storageDelete(key){
  try{
    await fetch('/.netlify/functions/storage?key=' + encodeURIComponent(key), { method: 'DELETE' });
  }catch(e){ console.error('Erreur de suppression', e); }
}

async function loadAll(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      data = Object.assign(data, JSON.parse(res.value));
    }
  }catch(e){ /* pas de donnée existante */ }
  try{
    const res = await storageGet(IMAGE_KEY);
    if(res && res.value){
      gamePlanImage = JSON.parse(res.value);
    }
  }catch(e){ /* pas d'image existante */ }
  try{
    const res = await storageGet(ADV_IMAGES_KEY);
    if(res && res.value){
      adversaireImages = JSON.parse(res.value);
    }
  }catch(e){ /* pas de photos existantes */ }
  render();
}

async function saveData(){
  await storageSet(STORAGE_KEY, JSON.stringify(data));
}

async function saveImage(){
  if(gamePlanImage){
    await storageSet(IMAGE_KEY, JSON.stringify(gamePlanImage));
  }else{
    await storageDelete(IMAGE_KEY);
  }
}

async function saveAdvImages(){
  await storageSet(ADV_IMAGES_KEY, JSON.stringify(adversaireImages));
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1400;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  TABS.forEach(tab=>{
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (tab.id === activeTab ? ' active' : '');
    btn.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor">${ICONS[tab.icon]}</svg><span>${tab.label}</span>`;
    btn.addEventListener('click', ()=>{ activeTab = tab.id; render(); });
    bar.appendChild(btn);
  });
}

function videoAddForm(prefix){
  return `
    <div class="add-form">
      <div class="field"><label>Titre</label><input id="${prefix}Title" placeholder="Titre de la vidéo"/></div>
      <div class="field"><label>Lien (YouTube, Vimeo, Drive)</label><input id="${prefix}Url" placeholder="https://..."/></div>
      <button class="btn-add" data-add="${prefix}">Ajouter la vidéo</button>
    </div>
  `;
}

function fichierAddForm(prefix){
  return `
    <div class="add-form">
      <div class="field"><label>Titre</label><input id="${prefix}Title" placeholder="Nom du document"/></div>
      <div class="field"><label>Lien (Drive, Dropbox...)</label><input id="${prefix}Url" placeholder="https://..."/></div>
      <button class="btn-add" data-add="${prefix}">Ajouter le fichier</button>
    </div>
  `;
}

function videoListHtml(videos, kind){
  if(!videos.length) return '<p class="empty">Aucune vidéo pour le moment.</p>';
  return '<div class="item-list">' + videos.slice().reverse().map(v=>{
    const ytId = youtubeId(v.url);
    const vimeoEmbed = !ytId ? embedUrl(v.url) : null;
    let media = '';
    if(ytId){
      media = `<div class="item-embed"><iframe src="https://www.youtube.com/embed/${ytId}" title="${escapeHtml(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
    } else if(vimeoEmbed){
      media = `<div class="item-embed"><iframe src="${vimeoEmbed}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    } else {
      media = `<a class="item-link" href="${v.url}" target="_blank" rel="noopener">Ouvrir la vidéo →</a>`;
    }
    return `
      <div class="item-card">
        <div class="item-top">
          <div><p class="item-title">${escapeHtml(v.title)}</p><p class="item-meta">${v.date}</p></div>
          <button class="del-btn" data-del="${kind}" data-id="${v.id}">&times;</button>
        </div>
        ${media}
      </div>
    `;
  }).join('') + '</div>';
}

function fichierListHtml(fichiers, kind){
  if(!fichiers.length) return '<p class="empty">Aucun fichier pour le moment.</p>';
  return '<div class="item-list">' + fichiers.slice().reverse().map(f=>`
    <div class="item-card">
      <div class="item-top">
        <div><p class="item-title">${escapeHtml(f.title)}</p><p class="item-meta">${f.date}</p></div>
        <button class="del-btn" data-del="${kind}" data-id="${f.id}">&times;</button>
      </div>
      <a class="item-link" href="${f.url}" target="_blank" rel="noopener">Ouvrir le fichier →</a>
    </div>
  `).join('') + '</div>';
}

function renderMain(){
  const main = document.getElementById('mainArea');
  let html = '';

  if(activeTab === 'gamePlan'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Game Plan</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      <div class="card">
        <p class="card-label"><span>Notes</span><span class="save-hint" id="hint-notes">enregistré</span></p>
        <textarea id="gamePlanNotes" placeholder="Principes, consignes, structure du plan de jeu...">${escapeHtml(data.gamePlan.notes || '')}</textarea>
      </div>
      <h2 class="sub">Photo du plan de jeu</h2>
      ${gamePlanImage ? `
        <div class="image-preview">
          <img src="${gamePlanImage.dataUrl}" alt="Game plan" />
          <button class="remove-img" id="removeImg">Supprimer</button>
        </div>
        <label class="image-drop" style="display:block; margin-top:10px;">
          <input type="file" id="gamePlanImageInput" accept="image/*" />
          <div class="lbl">Remplacer la photo</div>
        </label>
      ` : `
        <label class="image-drop">
          <input type="file" id="gamePlanImageInput" accept="image/*" />
          <div class="lbl">+ Ajouter une photo</div>
          <div class="hint">Prendre une photo ou choisir depuis la pellicule</div>
        </label>
      `}
    `;
  }

  if(activeTab === 'lancements'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Lancements</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      ${videoAddForm('lanc')}
      ${videoListHtml(data.lancements.videos, 'lancements')}
    `;
  }

  if(activeTab === 'videoSemaine'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Vidéo de la semaine</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      ${videoAddForm('vsem')}
      ${videoListHtml(data.videoSemaine.videos, 'videoSemaine')}
    `;
  }

  if(activeTab === 'presentationAdversaire'){
    html += `
      <div class="section-head"><p class="eyebrow">Projet de jeu</p><h1>Présentation de l'adversaire</h1></div>
      <div class="divider"><div class="mark"></div><div class="line"></div></div>
      <div class="card">
        <p class="card-label"><span>Notes</span><span class="save-hint" id="hint-adv-notes">enregistré</span></p>
        <textarea id="advNotes" placeholder="Points clés, forces/faiblesses, joueurs à surveiller...">${escapeHtml(data.presentationAdversaire.notes || '')}</textarea>
      </div>
      <h2 class="sub">Photos</h2>
      ${adversaireImages.length ? `
        <div class="photo-grid">
          ${adversaireImages.map(img => `
            <div class="photo-thumb">
              <img src="${img.dataUrl}" alt="" />
              <button class="photo-del" data-adv-del="${img.id}">&times;</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <label class="image-drop">
        <input type="file" id="advImageInput" accept="image/*" multiple />
        <div class="lbl">+ Ajouter une photo</div>
        <div class="hint">Plusieurs photos possibles</div>
      </label>
    `;
  }

  main.innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  const notesArea = document.getElementById('gamePlanNotes');
  if(notesArea){
    notesArea.addEventListener('blur', ()=>{
      data.gamePlan.notes = notesArea.value;
      saveData();
      const hint = document.getElementById('hint-notes');
      if(hint){ hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'), 1400); }
    });
  }

  const imgInput = document.getElementById('gamePlanImageInput');
  if(imgInput){
    imgInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImage(file);
        gamePlanImage = { dataUrl, name: file.name };
        await saveImage();
        render();
      }catch(err){
        alert("Impossible de charger l'image, réessayez avec une autre photo.");
      }
    });
  }

  const removeImg = document.getElementById('removeImg');
  if(removeImg){
    removeImg.addEventListener('click', async ()=>{
      gamePlanImage = null;
      await saveImage();
      render();
    });
  }

  const advNotes = document.getElementById('advNotes');
  if(advNotes){
    advNotes.addEventListener('blur', ()=>{
      data.presentationAdversaire.notes = advNotes.value;
      saveData();
      const hint = document.getElementById('hint-adv-notes');
      if(hint){ hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'), 1400); }
    });
  }

  const advImageInput = document.getElementById('advImageInput');
  if(advImageInput){
    advImageInput.addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      try{
        for(const file of files){
          const dataUrl = await compressImage(file);
          adversaireImages.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), dataUrl, name:file.name});
        }
        await saveAdvImages();
        render();
      }catch(err){
        alert("Impossible de charger une des photos, réessayez.");
      }
    });
  }

  document.querySelectorAll('[data-adv-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      adversaireImages = adversaireImages.filter(img=>img.id !== btn.dataset.advDel);
      await saveAdvImages();
      render();
    });
  });

  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const prefix = btn.dataset.add;
      const titleEl = document.getElementById(prefix+'Title');
      const urlEl = document.getElementById(prefix+'Url');
      const title = titleEl.value.trim();
      const url = urlEl.value.trim();
      if(!title || !url) return;
      const entry = {id:Date.now().toString(36), title, url, date:new Date().toLocaleDateString('fr-FR')};
      if(prefix === 'lanc') data.lancements.videos.push(entry);
      if(prefix === 'vsem') data.videoSemaine.videos.push(entry);
      titleEl.value = ''; urlEl.value = '';
      saveData();
      render();
    });
  });

  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = btn.dataset.del;
      const id = btn.dataset.id;
      if(kind === 'lancements') data.lancements.videos = data.lancements.videos.filter(v=>v.id!==id);
      if(kind === 'videoSemaine') data.videoSemaine.videos = data.videoSemaine.videos.filter(v=>v.id!==id);
      saveData();
      render();
    });
  });
}

function render(){
  document.getElementById('clubName').value = data.clubName || 'Provence Rugby';
  renderTabbar();
  renderMain();
}

document.getElementById('clubName').addEventListener('blur', e=>{
  data.clubName = e.target.value;
  saveData();
});

loadAll();
</script>
